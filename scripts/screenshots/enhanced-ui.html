<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>findIndian.de — device-accurate mockups</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; background: #000; }
    .phone {
      width: 390px; height: 844px; overflow: hidden;
      position: fixed; left: 0; top: 0; display: none; flex-direction: column;
      background: #0b0f14; color: #f5f5f5;
    }
    .phone.active { display: flex; }
    .status { height: 44px; flex-shrink: 0; }
    .app-header {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px 10px; background: #0b0f14;
    }
    .app-header img.av { width: 36px; height: 36px; border-radius: 18px; object-fit: cover; }
    .search {
      flex: 1; height: 40px; border-radius: 8px; background: #1a2332;
      display: flex; align-items: center; padding: 0 12px; color: #8b9cb3; font-size: 14px;
    }
    .msg-btn { position: relative; font-size: 22px; width: 36px; text-align: center; }
    .badge9 {
      position: absolute; top: -4px; right: -2px; background: #e53935; color: #fff;
      font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 8px;
    }
    .simple-header {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 48px 12px; background: #0b0f14; position: relative;
    }
    .simple-header h1 { font-size: 17px; font-weight: 700; }
    .simple-header .av-left {
      position: absolute; left: 12px; width: 36px; height: 36px; border-radius: 18px;
    }
    .simple-header .msg-btn { position: absolute; right: 12px; }
    .content { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .tabs {
      height: 56px; flex-shrink: 0; display: flex; justify-content: space-around;
      background: #0b0f14; border-top: 1px solid #1e293b; padding-top: 4px;
      font-size: 10px; font-weight: 600; color: #64748b;
    }
    .tabs .on { color: #f8fafc; }
    .tab { text-align: center; }
    .tab span { display: block; font-size: 18px; margin-bottom: 2px; }

    /* Members */
    .map-wrap { height: 268px; flex-shrink: 0; position: relative; }
    #members-map { width: 100%; height: 100%; background: #dbeafe; }
    .sheet {
      flex: 1; background: #111827; border-radius: 20px 20px 0 0; margin-top: -12px;
      padding: 16px 12px 0; min-height: 0; overflow: hidden;
    }
    .sheet h2 { font-size: 18px; font-weight: 700; }
    .sheet .sub { font-size: 13px; color: #94a3b8; margin-top: 4px; margin-bottom: 12px; }
    .grid { display: flex; flex-wrap: wrap; }
    .member {
      width: 33.333%; padding: 6px 4px 10px; text-align: center;
    }
    .member img, .member .ph {
      width: 64px; height: 64px; border-radius: 32px; margin: 0 auto; object-fit: cover;
      border: 2px solid #334155;
    }
    .member .ph {
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 22px; color: #60a5fa;
    }
    .member .name { font-size: 11px; font-weight: 700; margin-top: 6px; }
    .member .loc { font-size: 10px; color: #94a3b8; margin-top: 2px; }

    /* Leaderboard */
    .lb-scroll { flex: 1; overflow: hidden; padding: 0 12px; }
    .lb-hint { font-size: 11px; color: #94a3b8; padding: 8px 4px 10px; line-height: 1.35; }
    .lb-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .lb-tab {
      flex: 1; text-align: center; padding: 10px; border-radius: 8px;
      background: #1a2332; color: #94a3b8; font-weight: 600; font-size: 14px;
    }
    .lb-tab.on { background: #1e293b; color: #fff; border-bottom: 2px solid #ef4444; }
    .lb-row {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      border-radius: 12px; margin-bottom: 8px; border: 1px solid #334155;
      background: #1a2332;
    }
    .lb-row.r1 { background: #000; border-color: #000; }
    .lb-row.r2 { background: #DD0000; border-color: #DD0000; }
    .lb-row.r3 { background: #FFCC00; border-color: #FFCC00; color: #111; }
    .lb-row.r3 .meta, .lb-row.r3 .pts { color: #111 !important; }
    .lb-rank { font-weight: 800; width: 28px; font-size: 15px; }
    .lb-row img, .lb-row .ph {
      width: 44px; height: 44px; border-radius: 22px; object-fit: cover;
      border: 2px solid rgba(255,255,255,0.25);
    }
    .lb-row .ph {
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .lb-meta { flex: 1; }
    .lb-name { font-weight: 700; font-size: 15px; }
    .lb-city { font-size: 12px; opacity: 0.75; }
    .lb-pts { font-weight: 700; font-size: 14px; }

    /* Posts */
    .post {
      margin: 0 12px 10px; padding: 14px; background: #1a2332; border-radius: 12px;
      border: 1px solid #334155;
    }
    .post-head { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    .post-head img, .post-head .ph {
      width: 36px; height: 36px; border-radius: 18px; object-fit: cover;
    }
    .post-head .ph {
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; background: #334155;
    }
    .post h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .post p { font-size: 13px; color: #cbd5e1; line-height: 1.45; }
    .post .comments { font-size: 12px; color: #64748b; margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px; }

    /* Channel */
    .chat { flex: 1; padding: 10px 12px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
    .msg-row { display: flex; gap: 8px; align-items: flex-start; }
    .msg-row img, .msg-row .ph {
      width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; object-fit: cover;
    }
    .msg-row .ph {
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .bubble {
      flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 8px 10px; font-size: 13px; line-height: 1.4;
    }
    .bubble .who { color: #60a5fa; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
    .input-bar {
      display: flex; gap: 8px; padding: 10px 12px; background: #0b0f14; border-top: 1px solid #1e293b;
    }
    .input-bar .field {
      flex: 1; background: #1a2332; border-radius: 22px; padding: 10px 14px;
      color: #64748b; font-size: 15px;
    }
    .send {
      width: 44px; height: 44px; border-radius: 22px; background: #22c55e;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }

    /* Flyers */
    .flyers-body { flex: 1; overflow: hidden; background: #111827; }
    .fly-hero {
      margin: 12px; padding: 14px; background: #1a2332; border-radius: 14px; border: 1px solid #334155;
    }
    .fly-scene {
      height: 88px; background: linear-gradient(180deg, #1e3a5f 0%, #0f172a 100%);
      border-radius: 10px; margin-bottom: 10px; position: relative;
    }
    .fly-scene .plane { position: absolute; right: 24px; top: 20px; font-size: 26px; }
    .fly-scene .flags { position: absolute; left: 12px; bottom: 8px; font-size: 18px; }
    .fly-point { font-size: 12px; color: #cbd5e1; margin-bottom: 4px; line-height: 1.35; }
    .cta {
      margin-top: 10px; background: #f97316; color: #fff; text-align: center;
      padding: 12px; border-radius: 10px; font-weight: 700;
    }
    .month { padding: 10px 16px 6px; font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.05em; }
    .fly-row {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      background: #1a2332; margin: 0 12px 8px; border-radius: 12px; border: 1px solid #334155;
    }
    .fly-row img, .fly-row .ph {
      width: 44px; height: 44px; border-radius: 22px; object-fit: cover;
    }
    .fly-row .route { font-size: 13px; font-weight: 600; }
    .fly-row .city { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .fly-row .date { margin-left: auto; font-size: 11px; color: #94a3b8; text-align: right; max-width: 100px; }

    /* Messages list */
    .msg-nav { padding: 12px 16px; font-weight: 700; font-size: 17px; background: #0b0f14; }
    .conv {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
    }
    .conv img, .conv .ph { width: 48px; height: 48px; border-radius: 24px; object-fit: cover; }
    .conv .hash {
      width: 48px; height: 48px; border-radius: 24px; background: #14532d; color: #4ade80;
      display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
    }
    .conv .name { font-weight: 600; font-size: 16px; }
    .conv .prev { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .section-label { padding: 8px 16px; font-size: 11px; font-weight: 700; color: #64748b; }

    /* Jobs */
    .job {
      margin: 10px 12px; padding: 14px; background: #1a2332; border-radius: 12px; border: 1px solid #334155;
    }
    .job h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .job .co { color: #94a3b8; font-size: 14px; margin-bottom: 8px; }
    .job .meta { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .job p { font-size: 13px; color: #cbd5e1; line-height: 1.4; margin-bottom: 10px; }
    .job .tag { display: inline-block; background: #0f172a; padding: 4px 10px; border-radius: 6px; font-size: 11px; color: #94a3b8; }
    .apply { float: right; background: #f97316; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; }

    /* DM */
    .dm-header {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      background: #0b0f14; border-bottom: 1px solid #1e293b;
    }
    .dm-header .back { font-size: 22px; color: #60a5fa; }
    .dm-header img, .dm-header .ph { width: 40px; height: 40px; border-radius: 20px; }
    .dm-header .name { font-weight: 700; font-size: 17px; }
    .dm-header .sub { font-size: 12px; color: #94a3b8; }
    .dm-chat { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .dm-in { align-self: flex-start; max-width: 82%; background: #1e293b; border: 1px solid #334155; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
    .dm-out { align-self: flex-end; max-width: 82%; background: #14532d; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
  </style>
</head>

function appHeader() {
  return `<div class="status"></div><div class="app-header">
    <img class="av" src="${PRIYA}" alt="" />
    <div class="search">🔍 Search by name, city</div>
    <div class="msg-btn">💬<span class="badge9">9+</span></div>

}

function simpleHeader(title) {

function tabs(active) {

  return `<div class="tabs">${items.map(([l,ic]) =>
    `<div class="tab${l===active?' on':''}"><span>${ic}</span>${l}</div>`

}

function ph(letter, bg) {

}

    </div>
  </div>`,
};

document.body.innerHTML = Object.values(screens).join('');

const target = new URLSearchParams(location.search).get('screen');
if (target) {
  document.querySelectorAll('.phone').forEach((el) => {
    el.classList.toggle('active', el.id === 'screen-' + target);
  });
}

function initMembersMap() {
  const el = document.getElementById('members-map');
  if (!el || el.dataset.ready) return;
  el.dataset.ready = '1';
  const map = L.map('members-map', { zoomControl: true, attributionControl: true }).setView([51.0, 10.5], 6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  const accent = '#667eea';
  const markers = [
    [52.52, 13.405, 'Berlin', 42],
    [48.1351, 11.582, 'Munich', 28],
    [53.5511, 9.9937, 'Hamburg', 15],
    [50.1109, 8.6821, 'Frankfurt', 19],
    [51.0504, 13.7373, 'Dresden', 7],
    [52.3759, 9.732, 'Hannover', 11],
  ];
  markers.forEach(([lat, lng, city, count]) => {
    const icon = L.divIcon({
      className: 'leaflet-custom-marker',
      html: `<div class="leaflet-city-marker" style="display:inline-flex;align-items:flex-start;gap:6px;white-space:nowrap;padding:2px 4px">
        <span style="font-size:15px;font-weight:600;color:#1a1a1a;font-family:sans-serif;text-shadow:0 0 3px rgba(255,255,255,0.85)">${city}</span>
        <span style="font-size:10px;font-weight:700;color:#fff;background:${accent};padding:2px 6px;border-radius:10px">+${count}</span>
      </div>`,
      iconSize: [null, null],
      iconAnchor: [0, 0],
    });
    L.marker([lat, lng], { icon }).addTo(map);
  });
  setTimeout(() => map.invalidateSize(), 100);
}

if (!target || target === 'members') {
  setTimeout(initMembersMap, 200);
}
</script>
</body>
</html>
